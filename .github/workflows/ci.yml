name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The published package has no runtime dependencies and supports Node 20,
  # even though the test tooling needs Node 22+.
  node20-smoke:
    name: Smoke test on Node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts && npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node dist/cli.js --version
      - run: node dist/cli.js rules --format json > /dev/null
      - run: node dist/cli.js scan test/fixtures/corpus/benign --fail-on high

  dogfood:
    name: Scan the test corpus with the action
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Scan the benign corpus (must pass)
        uses: ./
        with:
          paths: test/fixtures/corpus/benign
          upload-sarif: 'false'
